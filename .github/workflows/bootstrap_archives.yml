name: Generate bootstrap archives (android-7)

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {} # none

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch:
          - aarch64
          - arm
    if: github.repository == 'YatoNorai/termux-packages'
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get install -y xz-utils zip
      - name: Create bootstrap archive
        run: ./scripts/generate-bootstraps.sh --architectures ${{ matrix.arch }}
      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-archives-${{ matrix.arch }}-${{ github.sha }}
          path: "*.zip*"

  publish:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-24.04
    if: github.repository == 'YatoNorai/termux-packages'
    steps:
      - name: Git clone
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch bootstrap archives
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ./
      - name: Create new tag
        id: get_tag
        run: |
          new_tag="bootstrap-$(date "+%Y.%m.%d")"
          existing_tag_revision=$(git tag | grep "$new_tag" | sort -r | head -n 1 | cut -d- -f3 | cut -dr -f2)
          if [ -n "$existing_tag_revision" ]; then
            tag_rev=$((existing_tag_revision + 1))
          else
            tag_rev=1
          fi
          new_tag="${new_tag}-r${tag_rev}+apt.android-7"
          echo "tag_name=$new_tag" >> $GITHUB_OUTPUT
      - name: Publish bootstrap archives to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.get_tag.outputs.tag_name }} \
            --title "Bootstrap archives for Layer IDE Terminal (apt.android-7)" \
            --repo YatoNorai/termux-packages
          for file in *.zip *.zip.9; do
            [ -f "$file" ] && gh release upload ${{ steps.get_tag.outputs.tag_name }} "$file" --repo YatoNorai/termux-packages
          done
